<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>dsh-peak-badge demo</title>
<style>
  /* Stand-ins for the DSH theme tokens the component reads. Values are the
     resolved light/dark pairs of the shipped theme
     (dsh-client-ui-theme/lib/client.js: body{--dsw-static-*…} plus the alias
     table). Only the palette is faked here — the component's own rules are the
     real ones, sliced out of client.js. */
  :root {
    /* Static palette: the tokens both opaque fills read resolve from here, so the
       stand-in is complete. Values are the shipped ones. */
    --dsw-static-neutral-bluish-00: #ffffff;
    --dsw-static-neutral-bluish-150: #e9ecf2;
    --dsw-static-neutral-bluish-700: #61666b;
    --dsw-static-neutral-bluish-750: #43454a;
    --dsw-static-neutral-bluish-850: #2c2c2e;
    --dsw-static-neutral-bluish-875: #232324;
    /* The wallpaper plugin's share of the fills. Defaults are chosen so the demo
       actually EXERCISES the tint rather than passing through it: at
       `--we-wallpaper-opacity: 0` the weight is 0, the tint cancels out, and a typo
       in the colour-mix would render identically to a correct one. `0.2` is a
       strong wallpaper (the plugin's variable is the COMPLEMENT of its opacity
       slider, so a lower value means a more visible picture), and the colour is a
       wall-derived sand that the plugin would have clamped into the readable band. */
    --we-wallpaper-opacity: 0.5;
    --we-surface-tint-light: #b98f5e;
    --we-surface-tint-dark: #6b5636;
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-bg-overlay: var(--dsw-static-neutral-bluish-150);
    --dsw-alias-border-l1: #0000000a;
    --dsw-alias-border-l2: #0000001a;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-label-caption: #adb2b8;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* The real app marks the dark theme with `data-ds-dark-theme` on <body>, and
     the component's own dark rules are written against that attribute. This page
     must carry it too, or every dark shot renders the light-theme branch and a
     dark-theme regression would be invisible in the very PNG that is supposed to
     show it. `data-theme` stays as this page's own switch for the local palette. */
  body[data-ds-dark-theme] {
    --dsw-alias-bg-base: #1b1b1c;
    --dsw-alias-bg-layer-1: #232324;
    --dsw-alias-bg-layer-2: #2c2c2e;
    --dsw-alias-bg-overlay: var(--dsw-static-neutral-bluish-700);
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-border-l2: #ffffff1f;
    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-label-tertiary: #adb2b8;
    --dsw-alias-label-caption: #979da6;
    --dsw-alias-state-warn-primary: #f59e0b;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font: 13px/1.6 var(--dsw-font-family);
    -webkit-font-smoothing: antialiased;
  }

  /* The composer row the chip actually lives in, in miniature: the real seat is
     `conversation.input.left`, i.e. the left end of the composer's tool row. */
  .composer {
    width: 620px; margin: 0 auto; padding: 10px 12px 12px; box-sizing: border-box;
    border: 1px solid var(--dsw-alias-border-l2); border-radius: 14px;
    background: var(--dsw-alias-bg-layer-1);
  }
  .composer-text { min-height: 52px; color: var(--dsw-alias-label-tertiary); font-size: 14px; }
  .composer-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .composer-tools .spacer { flex: 1; }
  .pill {
    height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px;
    border-radius: 999px; color: var(--dsw-alias-label-secondary); font-size: 12px;
  }
  .pill-plain { color: var(--dsw-alias-label-caption); }
  .circle {
    width: 24px; height: 24px; border-radius: 50%; corner-shape: round;
    background: var(--dsw-alias-label-primary); opacity: .9;
  }

  /* Shot framing: `?view=chip` and `?view=card` crop to the component.
     Only the composer's OTHER parts are hidden. Hiding `.composer` itself takes
     the chip with it — the seat is inside that element, so the chip measured
     0×0 and every shot came out blank while the DOM looked perfect.
     The stage stays a block on purpose: as an inline-flex it shrink-wraps the
     zero-width seat and the card's absolute position has nothing to hang off.
     The card opens upward, so the card view pads the top to leave it room. */
  body[data-view="chip"] .composer-text,
  body[data-view="chip"] .composer-tools > .pill,
  body[data-view="chip"] .composer-tools > .circle,
  body[data-view="card"] .composer-text,
  body[data-view="card"] .composer-tools > .pill,
  body[data-view="card"] .composer-tools > .circle { display: none; }
  body[data-view="chip"] .composer,
  body[data-view="card"] .composer {
    width: auto; margin: 0; padding: 0; border: 0; background: none;
  }
  body[data-view="chip"] .composer-tools,
  body[data-view="card"] .composer-tools { margin-top: 0; }
  body[data-view="chip"] .stage { padding: 50px 0 0 50px; }
  /* The card is taller than it looks: the "next switch" row wraps to two lines
     in Chinese, so 130px of headroom cut the first two rows off the top of the
     frame. 240px clears the tallest state. */
  body[data-view="card"] .stage { padding: 360px 0 0 50px; }
</style>
<script>
  // The component's own stylesheet comes from client.js so these images cannot
  // drift away from what the plugin ships. A browser refuses `fetch` on a
  // `file://` page (CORS), so the screenshot harness writes a copy of this page
  // with the CSS inlined and `?inlined=1`; only a person opening the file
  // directly takes the fetch path.
  window.__componentCss = async function componentCss() {
    // The harness writes a copy of this page with the stylesheet already in the
    // document. Detecting that beats trusting a query flag: a flag the caller
    // forgets means a blank shot that still looks like a successful render.
    if (document.querySelector('style[data-demo-from="client.js"]') !== null) return;
    const source = await (await fetch('../client.js')).text();
    const start = source.indexOf('// #region styles');
    const end = source.indexOf('// #endregion', start);
    if (start < 0 || end < 0) throw new Error('the styles region is missing from client.js');
    // Anchor on `const CSS = ` and not on the region's first backtick: the first
    // backticks in the region belong to `const STYLE_TAG_ID = \`${PACKAGE_ID}/styles\`;`.
    const region = source.slice(start, end);
    const anchor = 'const CSS = `';
    const at = region.indexOf(anchor);
    const close = region.indexOf('`;', at + anchor.length);
    if (at < 0 || close < 0) throw new Error('the CSS template literal is missing from client.js');
    const tag = document.createElement('style');
    tag.setAttribute('data-demo-from', 'client.js');
    tag.textContent = region.slice(at + anchor.length, close);
    document.head.append(tag);
  };
</script>
</head>
<body data-theme="light" data-view="composer" data-state="off" data-lang="zh">
  <main class="stage">
    <section class="composer">
      <div class="composer-text">问点什么，或者 / 调命令</div>
      <div class="composer-tools">
        <span class="pill pill-plain">＋</span>
        <span id="seat"></span>
        <span class="spacer"></span>
        <span class="pill">DeepSeek-V4-Flash Max</span>
        <span class="circle"></span>
      </div>
    </section>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  const view = ['chip', 'card', 'toast'].includes(params.get('view')) ? params.get('view') : 'composer';
  const peak = params.get('state') === 'peak';
  const en = params.get('lang') === 'en';
  document.body.dataset.theme = theme;
  // The dark-theme switch the component's own rules read. Kept in step with the
  // query parameter by hand: this page has no theme service to subscribe to.
  if (theme === 'dark') document.body.setAttribute('data-ds-dark-theme', '');
  else document.body.removeAttribute('data-ds-dark-theme');
  document.body.dataset.view = view;
  document.body.dataset.state = peak ? 'peak' : 'off';
  document.body.dataset.lang = en ? 'en' : 'zh';
  document.documentElement.lang = en ? 'en' : 'zh-CN';

  // Wording copied from TEXT_ZH / TEXT_EN in client.js. The demo is a still
  // image of two states, so the copy lives here rather than being re-derived;
  // `verify-policy.mjs` is what guards the real sentences.
  const COPY = {
    zh: {
      peak: '峰时', off: '谷时', title: 'DeepSeek 峰谷时段', state: '当前',
      discount: '计费', next: '下次切换', schedule: '高峰时段',
      weekday: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'],
      rateStandard: '标准价', rateOffPeak: '5 折 · 半价',
      peakReason: '工作日高峰时段，当前按标准价计价。',
      offReason: '工作日非高峰时段，当前按空闲时段计价。',
      alertLead: '切换提醒', alertOff: '关闭', alertMinutes: '提前 {n} 分钟',
      notify: '系统通知',
      notifyNotePrompt: '未开启 · 点一下会问一次权限',
      notifyNoteDenied: '未开启 · 权限被拒绝，点一下再试',
      notifyNoteUnsupported: '未开启 · 本机没有通知接口',
      notifyNoteIdle: '未开启 · 点一下开启',
      alertToPeak: '{at} 进入高峰时段',
      alertToOff: '{at} 进入空闲时段',
      alertToPeakBody: '还有 {left}。价格翻倍，要发就趁现在。',
      alertToOffBody: '还有 {left}。价格减半，不急就等一下。',
      dismiss: '关闭提醒',
    },
    en: {
      peak: 'Peak', off: 'Off-peak', title: 'DeepSeek peak / off-peak', state: 'Now',
      discount: 'Rate', next: 'Next switch', schedule: 'Peak hours',
      weekday: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      rateStandard: 'standard rate', rateOffPeak: '50% · half price',
      peakReason: 'Peak window on a working day, currently billed at the standard rate.',
      offReason: 'Off-peak window on a working day, currently billed at the off-peak rate.',
      alertLead: 'Warn before', alertOff: 'Off', alertMinutes: '{n} min before',
      notify: 'System notification',
      notifyNotePrompt: 'Off · pressing this asks for permission once',
      notifyNoteDenied: 'Off · permission was refused, press to try again',
      notifyNoteUnsupported: 'Off · this machine has no notification API',
      notifyNoteIdle: 'Off · press to turn on',
      alertToPeak: 'Peak starts at {at}',
      alertToOff: 'Off-peak starts at {at}',
      alertToPeakBody: 'In {left}. The rate doubles — send now if you are going to send.',
      alertToOffBody: 'In {left}. The rate halves — wait a moment if you can.',
      dismiss: 'Dismiss',
    },
  }[en ? 'en' : 'zh'];

  // 2026-08-19 is a Wednesday; 10:00 Beijing is peak, 15:30 is off-peak. The
  // off-peak shot is deliberately the widest case the card can print: a
  // 4-day gap during 国庆节, which is what used to wrap `下次切换` onto two
  // lines. If the shot shows one line, that is the fix holding.
  const SAMPLE = peak
    ? { label: COPY.peak, status: 'peak', dateText: '2026-08-19', weekday: 3,
        rate: COPY.rateStandard,
        next: en ? 'tomorrow 09:00 (17 h 30 min)' : '明天 09:00（17 小时 30 分钟）',
        reason: COPY.peakReason }
    : { label: COPY.off, status: 'off', dateText: '2026-10-03', weekday: 6,
        rate: COPY.rateOffPeak,
        next: en ? 'in 4 days 09:00 (3 d 22 h)' : '4 天后 09:00（3 天 22 小时）',
        reason: en ? 'Statutory holiday: 国庆节. Billed off-peak all day.' : '法定节假日：国庆节，全天按空闲时段计价。' };

  const el = (tag, props, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null) continue;
      if (key === 'text') node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child);
    return node;
  };

  const row = (label, value, tone) => el('div', { class: 'peak-badge-row' },
    el('span', { class: 'peak-badge-key', text: label }),
    el('span', { class: 'peak-badge-value', 'data-tone': tone, text: value }));

  // The two settings the card grew. Same markup as `renderAlertControls` in
  // client.js, scaled down to the one value each control is being photographed
  // at: the real select carries all seven choices, the real checkbox carries the
  // browser's own permission state.
  //
  // `?notify=` picks which of the four states the row is in, because the real row
  // reads `Notification.permission` and a `file://` page cannot be talked into a
  // refusal. The values match `notifySupport()`'s vocabulary: `prompt` (nothing
  // tried yet, the default), `denied`, `unsupported`, and `idle` (a press that was
  // dismissed — `notifyHint === 'default'`).
  const LEAD = 2;
  const notify = ['prompt', 'denied', 'unsupported', 'idle'].includes(params.get('notify'))
    ? params.get('notify')
    : 'prompt';
  const NOTE = {
    prompt: COPY.notifyNotePrompt,
    denied: COPY.notifyNoteDenied,
    unsupported: COPY.notifyNoteUnsupported,
    idle: COPY.notifyNoteIdle,
  };
  const alertControls = () => el('div', { class: 'peak-badge-controls' },
    el('div', { class: 'peak-badge-control' },
      el('label', { class: 'peak-badge-key', for: 'peak-badge-alert-lead', text: COPY.alertLead }),
      (() => {
        const select = el('select', { class: 'peak-badge-select', id: 'peak-badge-alert-lead', 'data-dsh-peak-badge': 'alert-lead' });
        for (const minutes of [0, 1, 2, 5, 10, 15, 30]) {
          const option = el('option', {
            value: String(minutes),
            text: minutes === 0 ? COPY.alertOff : COPY.alertMinutes.replace('{n}', String(minutes)),
          });
          if (minutes === LEAD) option.setAttribute('selected', '');
          select.append(option);
        }
        return select;
      })()),
    el('div', { class: 'peak-badge-control' },
      el('label', { class: 'peak-badge-check', 'data-unavailable': notify === 'unsupported' ? 'yes' : 'no' },
        (() => {
          const box = el('input', { type: 'checkbox', 'data-dsh-peak-badge': 'alert-notify' });
          // Only the absent API is disabled; a refusal stays pressable on purpose.
          if (notify === 'unsupported') box.setAttribute('disabled', '');
          return box;
        })(),
        el('span', { text: COPY.notify }),
        el('span', { class: 'peak-badge-note', 'data-dsh-peak-badge': 'alert-note', text: NOTE[notify] }))));

  function renderCard() {
    return el('div', {
      class: 'peak-badge-card', 'data-dsh-peak-badge': 'card', role: 'dialog',
      'aria-label': COPY.title,
    },
      row(COPY.state, `${SAMPLE.label} · ${SAMPLE.dateText} ${COPY.weekday[SAMPLE.weekday]}`, SAMPLE.status),
      row(COPY.discount, SAMPLE.rate, SAMPLE.status),
      row(COPY.next, SAMPLE.next, undefined),
      row(COPY.schedule, '09:00–12:00 · 14:00–18:00', undefined),
      alertControls(),
      el('div', { class: 'peak-badge-foot', text: SAMPLE.reason }));
  }

  function renderToast() {
    const entering = peak ? 'peak' : 'off';
    const title = (peak ? COPY.alertToPeak : COPY.alertToOff).replace('{at}', peak ? '14:00' : '18:00');
    const body = (peak ? COPY.alertToPeakBody : COPY.alertToOffBody).replace('{left}', en ? '2 min' : '2 分钟');
    document.getElementById('seat').append(el('div', {
      class: 'peak-badge-toast', 'data-dsh-peak-badge': 'toast', 'data-entering': entering, role: 'status',
    },
      el('span', { class: 'peak-badge-dot', 'aria-hidden': 'true' }),
      el('div', { class: 'peak-badge-toasttext' },
        el('div', { class: 'peak-badge-toasttitle', text: title }),
        el('div', { text: body })),
      el('button', { type: 'button', class: 'peak-badge-toastclose', 'aria-label': COPY.dismiss, text: '×' })));
  }

  function render() {
    if (view === 'toast') {
      renderToast();
      return;
    }
    const seat = document.getElementById('seat');
    seat.textContent = '';
    const showCard = view === 'card';
    const root = el('div', { class: 'peak-badge-root' },
      el('button', {
        type: 'button', class: 'peak-badge-chip', 'data-status': SAMPLE.status,
        'data-dsh-peak-badge': 'chip', title: COPY.title,
        'aria-expanded': showCard ? 'true' : 'false', 'aria-haspopup': 'dialog',
      },
        el('span', { class: 'peak-badge-dot', 'aria-hidden': 'true' }),
        el('span', { text: SAMPLE.label })));
    if (showCard) root.append(renderCard());
    seat.append(root);
  }

  window.__componentCss().then(render).catch((error) => {
    document.body.append(el('pre', { text: String(error && error.message) }));
  });
</script>
</body>
</html>
